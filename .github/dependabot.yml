# Dependabot keeps SHA-pinned GitHub Actions current AND surfaces Python
# dependency updates. Without this, SHA pins are security theater: they
# prevent drift but never receive security patches either.
#
# Scope:
#   - GitHub Actions in `.github/workflows/*.yml`
#   - Python deps in `requirements.txt` (root)

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Wait a week before a newly published version is proposed. A compromised
    # release is usually caught and yanked within days; without a cooldown
    # Dependabot opens the PR within hours of publication, which is the window
    # that attack depends on.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/"
    # Wait a week before a newly published version is proposed. A compromised
    # release is usually caught and yanked within days; without a cooldown
    # Dependabot opens the PR within hours of publication, which is the window
    # that attack depends on.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
