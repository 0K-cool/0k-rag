# Public-repo CI template for ZerØK Labs open-source projects.
#
# Target repos: 0K-cool/{athena,0k-talon,0k-rag,mnemosyne,FORT,...} — all
# PUBLIC. For private repos (vex, versant-docs, …) use the Claude CI
# chain instead.
#
# To install: copy this file to `.github/workflows/ci.yml` in the target
# repo and commit. Adjust the `python-version` / bun install invocation
# if the repo uses pinned versions.
#
# Layers:
#   - Semgrep (community rules — free, no login required)
#   - Auto-detected test runner (bun / pytest)
#   - Explicit fail when neither runner fires (no silent green)
#
# Not in this template (provided by GitHub Apps on the 0K-cool org):
#   - CodeRabbit auto-review   → install: https://github.com/apps/coderabbitai
#   - GitGuardian secret scan  → configured at org level
#
# Supply chain: all GitHub Actions pinned to commit SHAs (not mutable
# tags) to prevent tj-actions-style compromise. When bumping, verify
# the new SHA with: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# Consider adding Dependabot (`.github/dependabot.yml` with
# package-ecosystem: github-actions) in each target repo.
#
# workflow_dispatch + secrets footgun: if you ever add repository
# secrets (e.g., CODECOV_TOKEN, NPM_TOKEN) to this workflow, gate every
# secret-reading step with `if: github.ref == 'refs/heads/main'`.
# workflow_dispatch can be triggered on ANY ref, making it a PPE
# (pwn-request-equivalent) amplifier if secrets are present. This
# template ships with NO secrets — safe as-is. Re-audit before adding.
#
# Decision record: see `.claude/skills/zero-drift/skill.md` Step 5c.0.

name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs for PR events. Cancelling on push-to-main
  # would let a force-push storm DoS the default branch CI lane during
  # release verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-analysis:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # NOT semgrep/semgrep-action — it runs `semgrep ci`, the semgrep-app mode.
      # Without SEMGREP_APP_TOKEN it errors, announces "Semgrep will succeed
      # because there were no blocking findings", and exits 0.
      #
      # Measured 2026-07-28 across every repo using this template — vex,
      # 0k-talon, 0k-rag, mnemosyne — all showed `semgrep ci` -> banner -> job
      # cleanup in 2-3 seconds. Scanning nothing. Reporting pass. Every run
      # since the template was written. On vex, the first real scan found two
      # live command injections.
      #
      # `semgrep scan` needs no token. Verified: clean file -> exit 0; a file
      # with eval() + shell=True -> exit 1, "Findings: 2 (2 blocking)".
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.2.0
        with:
          python-version: '3.12'
      - name: Semgrep scan
        run: |
          set -eo pipefail
          pip install --quiet 'semgrep>=1.100.0'
          # Rule exclusions triaged on vex against 109 real hits, not guessed:
          #  path-join-resolve-traversal — join(dir, entry.name) from readdirSync;
          #    a POSIX dirent name cannot contain a separator.
          #  detect-non-literal-regexp — these codebases BUILD detection patterns
          #    from config by design; flagging it flags the architecture.
          # detect-child-process is deliberately NOT excluded: on vex it found
          # the real injection.
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --metrics=off \
            --exclude='**/node_modules/**' \
            --exclude-rule=javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule=javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # TypeScript / Bun branch — fires only if lockfile present
      # (frozen-lockfile would hard-fail if gated on package.json alone).
      - name: Setup Bun
        id: bun-setup
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          # Pin tool version, not just action SHA. Pre-1.1.x bun had
          # edge cases where `trustedDependencies` in package.json could
          # override `--ignore-scripts`, enabling install-time RCE from
          # fork-controlled lockfiles. Pinning to a post-1.1.x version
          # closes that vector.
          #
          # Bump manually — Dependabot's `package-ecosystem: github-actions`
          # updates action SHAs in `uses:` but NOT `with:` parameter
          # values. The bun version here will drift silently unless
          # bumped by hand alongside the setup-bun action bump.
          bun-version: '1.2.8'
          cache: true
      - name: bun install + test
        if: steps.bun-setup.conclusion == 'success'
        run: |
          set -eo pipefail
          # --ignore-scripts prevents dep postinstall hooks from executing
          # arbitrary code on the runner (frozen-lockfile pins the version
          # graph, not the execution model). Safe default here; re-enable
          # selectively if a specific dep legitimately requires postinstall.
          bun install --frozen-lockfile --ignore-scripts
          # `bun test` exits 0 when no test files match. Fail-fast here
          # instead of showing silent-green CI on a repo with a lockfile
          # but no actual tests committed yet.
          # `-name node_modules` prunes AT ANY DEPTH (monorepos with
          # packages/*/node_modules would otherwise surface vendored
          # test files as false positives).
          if ! find . -name node_modules -prune -o \
               \( -name '*.test.ts' -o -name '*.test.tsx' \
                  -o -name '*.test.js' -o -name '*.test.jsx' \
                  -o -name '*.spec.ts' -o -name '*.spec.tsx' \
                  -o -name '*.spec.js' -o -name '*.spec.jsx' \
               \) -print -quit | grep -q .; then
            echo "::error::No test files matched *.test.* / *.spec.* under the repo." >&2
            echo "::error::Add at least one test file, or explicitly document a no-tests policy in the target repo's CI." >&2
            exit 1
          fi
          bun test

      # Python / pytest branch — fires if any common Python project descriptor present
      # (pyproject.toml / requirements.txt / setup.cfg / setup.py)
      - name: Setup Python
        id: py-setup
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.cfg', 'setup.py') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # cache: 'pip' hashes requirements.txt when present. Repos with
          # only pyproject.toml (no lockfile) will hash pyproject itself
          # — cache invalidates on any metadata change, not just dep
          # changes. Acceptable for a template; for stability consider
          # adding `pip-compile` output (requirements.lock) in the
          # target repo.
          cache: 'pip'
      - name: pip install + pytest
        if: steps.py-setup.conclusion == 'success'
        run: |
          set -eo pipefail
          # Pin pytest FIRST — a malicious pyproject.toml from a fork PR
          # could declare pytest at a downgraded/patched version and
          # override the test runner before tests execute. Installing
          # pytest before the project ensures the test runner is known.
          # The `>=7.4.0` floor closes the remaining gap: `pip install
          # -r requirements.txt` below cannot silently downgrade pytest
          # to an older, potentially vulnerable release (pre-7.4 had
          # CVE-class issues around tmp_path_factory permissions).
          pip install "pytest>=7.4.0"
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # SUPPLY CHAIN WARNING: `pip install .` executes the PR's PEP 517
          # build backend + setup.py — arbitrary code from the fork.
          # Non-editable does NOT avoid this (both editable and standard
          # installs run the build backend). Acceptable here only because:
          #   - no secrets in the workflow env
          #   - `pull_request` trigger (not `pull_request_target`)
          #   - `contents: read` token cannot write to base repo
          #   - `persist-credentials: false` on checkout means no token
          #     written to .git/config for the build backend to read
          # Hardening conditionally applied: `--no-deps` blocks the build
          # backend from pulling (and executing build hooks for) additional
          # transitive deps at install time. The flag is only safe when
          # test-time deps are already installed out-of-band — so we gate
          # it on `requirements.txt` presence. A pyproject-only repo with
          # declared dependencies would get cryptic import errors at
          # pytest time if we used `--no-deps` unconditionally; in that
          # case we fall back to regular `pip install .` (still
          # protected by the SUPPLY CHAIN WARNING context above — no
          # secrets, no pull_request_target, read-only token) and rely
          # on pyproject metadata to declare the dep graph.
          # If a repo wants the hardening, the path is: generate a
          # pinned `requirements.txt` (e.g. `pip-compile`) and commit it.
          # Do NOT copy this pattern to workflows with write permissions
          # or secrets. Alternative for repos that don't need install:
          # use `PYTHONPATH=src pytest -v` to skip installation entirely.
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            if [ -f requirements.txt ]; then
              pip install . --no-deps
            else
              pip install .
            fi
          fi
          # Pre-flight guard mirroring the bun branch above. `pytest`
          # exits 5 when no tests are collected — `set -e` catches it,
          # but the resulting error is a cryptic pytest exit code rather
          # than a template-level configuration message. Surface an
          # explicit `::error::` so maintainers see the missing-tests
          # case the same way in both Python and TS branches.
          # `-name node_modules` also pruned so hybrid Python+TS repos
          # don't surface vendored JS test fixtures.
          # Note: `-quit` is a GNU-find extension. This currently runs
          # on `ubuntu-24.04` (which ships GNU find), but adopters
          # targeting `macos-*` runners would need to swap the pipeline
          # to `find ... -print 2>/dev/null | head -n 1 | grep -q .`
          # since BSD find lacks `-quit`.
          # `tests.py` added to the match list for Django-style suites
          # where all tests live in a single top-level file. `test*.py`
          # is deliberately NOT used — it would match unrelated files
          # like `testutils.py` in some older projects.
          if ! find . \( -name .venv -o -name venv -o -name .tox \
                         -o -name node_modules \) -prune -o \
               \( -name 'test_*.py' -o -name '*_test.py' \
                  -o -name 'tests.py' \) \
               -print -quit | grep -q .; then
            echo "::error::No Python test files matched (test_*.py / *_test.py / tests.py) under the repo." >&2
            echo "::error::Add at least one test file, or explicitly document a no-tests policy in the target repo's CI." >&2
            exit 1
          fi
          pytest -v

      # Explicit fail-if-neither-fired guard — prevents silent green
      # when a repo adds code in a language this template doesn't
      # recognize yet (go, rust, ruby, etc.). Force a template update
      # rather than shipping invisibly untested code.
      # Checking `== 'skipped'` (not `!= 'success'`): we only want this
      # guard to fire when NEITHER setup step even attempted to run
      # (meaning no recognized language). If a setup step ran but
      # FAILED (network, toolchain error), that step's own failure
      # already surfaces — we shouldn't mask it with a misleading
      # "no recognized runner" message.
      - name: Fail if no runner fired
        if: steps.bun-setup.conclusion == 'skipped' && steps.py-setup.conclusion == 'skipped'
        run: |
          set -eo pipefail
          echo "::error::No recognized test runner found." >&2
          echo "::error::Expected one of: bun.lock, bun.lockb, pyproject.toml, requirements.txt, setup.cfg, setup.py." >&2
          echo "::error::Update this template in PAI (`.claude/templates/workflows/public-repo-ci.yml`) to support this repo's runner (go, rust, ruby, etc.)." >&2
          exit 1

  # ==========================================================================
  # Reviewed-at-this-commit gate
  # ==========================================================================
  # Asserts that SOMETHING reviewed the commit this run is building. Two ways
  # to satisfy it, and under the unified review model (zero-drift Step 5c.0)
  # the FIRST one is the primary path, not an escape hatch:
  #
  #   1. An operator ran the in-session subscription reviewers (/code-review,
  #      /security-review, /pr-review-toolkit:review-pr) and applied the
  #      `reviewed-in-session` label. This is the real reviewer. It is free,
  #      never rate-limits, and is the only AI review still in the chain.
  #   2. CodeRabbit posted a genuine review. Advisory-tier and best-effort —
  #      taken when it happens, never waited on as the sole signal.
  #
  # Why this job is allowed to gate at all, when zero-drift says L3 advisory
  # reviewers NEVER gate: it does not gate on any reviewer's VERDICT. It gates
  # on whether a review ARTIFACT EXISTS for this commit. Same inputs, same
  # answer, every run — that is an L1 deterministic check that happens to be
  # about L2/L3 activity. Nothing here blocks on what a reviewer concluded.
  #
  # Costs nothing and needs no ANTHROPIC_API_KEY — GITHUB_TOKEN only.
  #
  # LIMIT, do not overstate: on a repo without branch protection a red check
  # cannot block a merge, only make merging an explicit act. On 0K-cool
  # private repos branch protection is unavailable on the current plan, so
  # this is visibility, not enforcement. Say so; do not call it a control.
  reviewed-at-this-commit:
    name: Reviewed at this commit
    # PR-only. This workflow also fires on push-to-main and workflow_dispatch,
    # where there is no pull_request context — without this guard the job fails
    # on every merge to main and paints the default branch red permanently.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Assert a real review exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -eo pipefail

          # Timestamp of the commit this run is reviewing. A CodeRabbit comment
          # last updated BEFORE this is a review of an earlier push, not of this
          # one. Committer date (not author date) so a rebase/amend counts as new.
          HEAD_TIME=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
          echo "Head commit $HEAD_SHA committed at $HEAD_TIME"

          # PRIMARY PATH: an operator attests that the in-session subscription
          # reviewers were run on this commit. Deliberately a LABEL, not a magic
          # commit-message string -- labels are visible in the PR UI,
          # attributable, and removable.
          #
          # The label is checked FOR FRESHNESS against the head commit, exactly
          # as CodeRabbit's comment is below. A label applied before the commit
          # under review attests to an earlier diff, so it does not count here.
          # Without this, one label early in a PR's life waived the gate for
          # every later push -- the same "green means nobody looked" hole this
          # job exists to close, relocated into its own escape hatch.
          #
          # Read from the timeline rather than the label list: the list says a
          # label IS present, the timeline says WHEN it was applied. --paginate
          # --slurp for the same reason as the comment fetch below -- a long PR
          # timeline pages, and a per-page `last` is not the last.
          #
          # The filter is a SEPARATE jq process, not `gh --jq`. `gh api --slurp`
          # refuses to run with `--jq` at all -- "the --slurp option is not
          # supported with --jq or --template" (gh 2.83.2), exit 1, no output.
          # Measured on 0k-talon#53: the first real execution of this job died
          # in 4 seconds on exactly that. Both queries here had been written
          # `--paginate --slurp --jq` across three review rounds, which means
          # this gate could never have passed OR correctly failed. Piping keeps
          # the pagination fix and drops the incompatibility.
          LABEL_TIME=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/timeline" \
            | jq -r '[ .[][]
                       | select(.event == "labeled")
                       | select(.label.name == "reviewed-in-session")
                       | .created_at ] | last // ""')

          if [ -n "$LABEL_TIME" ]; then
            if [ "$LABEL_TIME" \< "$HEAD_TIME" ]; then
              echo "::warning::Label 'reviewed-in-session' was applied at $LABEL_TIME," \
                   "BEFORE the head commit at $HEAD_TIME. It attests to an earlier diff," \
                   "not this one, so it does not satisfy this gate."
              echo "::warning::Re-run the in-session reviewers on the current diff, then" \
                   "remove and re-apply the label."
            else
              echo "Label 'reviewed-in-session' applied at $LABEL_TIME, after the head"
              echo "commit at $HEAD_TIME -- an operator attests the in-session reviewers"
              echo "were run on THIS commit. Gate satisfied."
              exit 0
            fi
          fi

          # SECONDARY PATH: CodeRabbit. Advisory tier -- taken if it happened,
          # never the thing we rely on. Skipped entirely where the App is not
          # installed: it is public-repo-only in this org, so on a private repo
          # the poll below would burn its full 10 minutes discovering nothing
          # and then report "CodeRabbit posted no comment", which reads as a CR
          # failure rather than the truth, which is that the label is the only
          # available path there.
          if [ "${IS_PRIVATE}" = "true" ]; then
            echo "::error::No review recorded for commit $HEAD_SHA." >&2
            echo "::error::This is a private repo, where the CodeRabbit App is not installed," >&2
            echo "::error::so the 'reviewed-in-session' label is the only way to satisfy this gate." >&2
            echo "::error::Run /code-review or /security-review on the current diff, then apply it." >&2
            exit 1
          fi

          # CR posts asynchronously; poll rather than race it. 10 attempts,
          # 60s apart, inside a 20min job timeout.
          for attempt in $(seq 1 10); do
            # --paginate AND --slurp are both required. The default page is 30
            # comments, so without paginate `last` means "last of the first 30".
            # But --paginate with --jq runs the filter PER PAGE and concatenates
            # the outputs — it does not build one array — so paginate alone still
            # yields a per-page last, blended into a multi-line blob. That opens
            # the mirror-image false positive: a stale rate-limit comment on an
            # early page would fail a PR that genuinely WAS reviewed.
            # --slurp collects the pages into an array of arrays; `.[][]`
            # flattens it so `last` is the true final comment on the thread.
            # Filtered by a separate jq, not `gh --jq` — see the note on
            # LABEL_TIME above; the two cannot be combined.
            cr=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
                 | jq -r '[.[][] | select(.user.login == "coderabbitai[bot]")] | last
                          | { body: (.body // ""), updated: (.updated_at // "") }')
            body=$(printf '%s' "$cr" | jq -r '.body')
            updated=$(printf '%s' "$cr" | jq -r '.updated')

            # FRESHNESS. Measured on 0k-talon#52: CodeRabbit posts ONE comment and
            # EDITS IT IN PLACE across pushes — created 06:05, updated 06:58, over
            # four commits. So on a `synchronize` run the previous push's comment is
            # already present and looks healthy; without this check the job would
            # pass instantly having never waited for CR to look at the new commits.
            # That is the same "green means nobody looked" failure this gate exists
            # to close, reached by a different route.
            #
            # `updated_at` is therefore the signal, not `created_at`. ISO-8601 UTC
            # sorts lexicographically, so a string compare is correct here.
            if [ -n "$body" ] && [ "$updated" \< "$HEAD_TIME" ]; then
              echo "attempt $attempt/10: CodeRabbit comment is stale (updated $updated," \
                   "head commit $HEAD_TIME) -- it has not reviewed this push yet; waiting 60s..."
              sleep 60
              continue
            fi

            if [ -n "$body" ]; then
              # NOT-YET-A-REVIEW. CodeRabbit posts a placeholder comment within
              # seconds of a PR opening -- "Currently processing new changes in
              # this PR" -- and only later EDITS it into the actual review. That
              # stub is fresh by definition and carries no rate-limit marker, so
              # without this check it satisfies the pass branch below.
              #
              # Observed 2026-07-28 on mnemosyne#65, the first PR to run this job
              # on that repo: gate green in 6 seconds, CodeRabbit check still
              # "Review in progress". A third route from "did not review" to
              # "green", inside the job written to close the other two.
              #
              # Keyed on the auto-generated HTML marker rather than the prose,
              # which is user-visible and likelier to be reworded.
              if printf '%s' "$body" | grep -qiF 'review in progress by coderabbit.ai'; then
                echo "attempt $attempt/10: CodeRabbit has posted only its" \
                     "'review in progress' placeholder, not a review; waiting 60s..."
                sleep 60
                continue
              fi

              # DELIBERATELY NARROW: these two markers are the one failure mode
              # actually observed (0k-talon#52, twice). CodeRabbit has other
              # "did not really review" states — path-filter exclusion, draft-PR
              # skip, "nothing to review" on a docs-only diff — that match
              # neither phrase and would fall through to the pass branch below.
              # Widen only against an observed instance; do not guess at strings.
              if printf '%s' "$body" | grep -qiE 'review limit reached|rate limited by coderabbit'; then
                echo "::error::CodeRabbit is RATE LIMITED and did not review this PR." >&2
                echo "::error::Its status check reports 'pass' regardless -- that green means nobody looked." >&2
                echo "::error::Fix: run an in-session subscription review (/pr-review-toolkit:review-pr," >&2
                echo "::error::/security-review) and add the 'reviewed-in-session' label, or wait for the" >&2
                echo "::error::CodeRabbit limit to reset and re-run this job." >&2
                exit 1
              fi
              echo "CodeRabbit posted a review with no rate-limit marker."
              exit 0
            fi

            echo "attempt $attempt/10: no CodeRabbit comment yet; waiting 60s..."
            sleep 60
          done

          echo "::error::No review recorded for commit $HEAD_SHA." >&2
          echo "::error::CodeRabbit posted nothing within 10 minutes, and no fresh" >&2
          echo "::error::'reviewed-in-session' label is present." >&2
          echo "::error::Treating absence as NOT REVIEWED rather than assuming success." >&2
          echo "::error::Fix, in preference order: run /code-review or /security-review on the" >&2
          echo "::error::current diff and apply the 'reviewed-in-session' label -- that is the" >&2
          echo "::error::primary path, and it does not depend on CodeRabbit being up." >&2
          exit 1
